{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "api.fullname" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "api.fullname" . }}
  rules:
    - backendRefs:
        - name: {{ include "api.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}