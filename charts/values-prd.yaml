image:
  pullPolicy: Always
  tag: ""

replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  DYNAMODB_TABLE: prima-tech-challenge-users
  S3_BUCKET: prima-tech-challenge-avatars

serviceAccount:
  create: true
  automount: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::803871048799:role/prima-tech-challenge-api
  name: "prima-tech-challenge-api"
